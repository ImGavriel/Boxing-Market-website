<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/contact.css" />
    <link rel="icon" href="favicon/favicon.png" type="Icon" />
    <title>Boxing Market</title>
  </head>

  <body>
    <header>
      <div class="title">
        <button class="bag">
          <img
            src="css/images/bag.jpg"
            alt="סל הקניות"
            width="75"
            height="75"
          />
        </button>
        <button class="login">
          <img
            src="css/images/login.png"
            alt="התחברות"
            width="55"
            height="55"
          />
        </button>
      </div>

      <div class="headerbox">
        <img
          src="css/images/logo.jpg"
          alt="לוגו האתר"
          width="425"
          height="300"
        />

        <nav>
          <ul>
            <li><a href="contact.html">צור קשר</a></li>
            <li><a href="main.html">עמוד הבית</a></li>
            <li><a href="about.html">קצת עלינו</a></li>
            <li><a href="products.html">מוצרים</a></li>
          </ul>
        </nav>
        <div class="search-container">
          <input type="text" class="search-input" placeholder="חיפוש.." />
          <button class="search-button">חיפוש</button>
        </div>
      </div>
    </header>

    <main>
      <h1>צור קשר - טופס פנייה</h1>

      <form action="your-server-endpoint" method="post">
        <label for="first-name">שם פרטי</label>
        <input
          type="text"
          id="first-name"
          name="FirstName"
          placeholder="דוגמא: הראל"
        />

        <label for="last-name">שם משפחה</label>
        <input
          type="text"
          id="last-name"
          name="LastName"
          placeholder="דוגמא: הלוי"
        />

        <label for="phone">טלפון</label>
        <input
          type="text"
          id="phone"
          name="Phone"
          placeholder="דוגמא: 052-1234567"
        />

        <label for="email">דואר אלקטרוני</label>
        <input
          type="email"
          id="email"
          name="Email"
          placeholder="example@gmail.com"
        />

        <label for="subject">נושא</label>
        <input
          type="text"
          id="subject"
          name="Subject"
          placeholder="נושא: המשלוח של ההזמנה שלי מתעקב"
        />

        <label for="details">אנחנו נשמח לעוד פרטים ממך</label>
        <textarea
          id="details"
          name="Details"
          placeholder="תוכן ההודעה שלך..."
        ></textarea>

        <button type="submit">שליחת הטופס</button>
      </form>
    </main>
    <footer>
      <div class="map-container">
        <iframe
          class="map-iframe"
          src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d13491.052345052225!2d34.864199!3d32.291347!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x151d3f87ac46e12f%3A0x66d7370ce1a26f48!2sORT%20Hermelin!5e0!3m2!1sen!2sil!4v1726584046760!5m2!1sen!2sil"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>

      <p>תעקבו אחרינו ברשתות החברתיות</p>
      <nav>
        <ul>
          <li><a href="https://www.tiktok.com/">טיקטוק</a></li>
          <li><a href="https://www.facebook.com/">פייסבוק</a></li>
          <li><a href="https://www.instagram.com/">אינסטגרם</a></li>
        </ul>
      </nav>
      <p>&copy; כל הזכויות שמורות</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
