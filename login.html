<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon/favicon.png" type="Icon" />
    <title>דף התחברות</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>התחברות</h2>
      <form id="login-form">
        <input
          type="text"
          id="username"
          placeholder=" Gabi=שם משתמש"
          required
        />
        <input
          type="password"
          id="password"
          placeholder="1234=סיסמה"
          required
        />
        <button type="submit">התחבר</button>
      </form>
      <p>אין לך חשבון? <a href="#">צור חשבון</a></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
